<style>
:root{--bg:#f5f3ee;--paper:#fff;--ink:#1c2333;--muted:#5d6779;--faint:#8a93a3;--line:#e4dfd4;--soft:#faf8f4;

*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 "Noto Sans TC","Inter",sans-serif}
.en{font-family:Georgia,"Times New Roman",serif}

#top .badge{background:#f0a429;color:var(--navy);font:800 11px Inter;border-radius:99px;padding:3px 10px}
#top .ttl{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .now{font-size:12px;background:#ffffff14;border-radius:99px;padding:3px 12px;white-space:nowrap}
#top .now b{color:#f0a429}
.timer{margin-left:auto;display:flex;align-items:center;gap:8px}
.timer span{font:700 18px "JetBrains Mono";color:#f0a429;min-width:62px;text-align:right}
.timer button{background:#ffffff1a;border:1px solid #ffffff2e;color:#fff;border-radius:8px;padding:5px 10px;font:700 12px "Noto Sans TC";cursor:pointer}
#menuBtn{display:none;background:none;border:0;color:#fff;font-size:20px;cursor:pointer}
/* Sidebar */
#side{position:fixed;top:54px;bottom:0;left:0;width:236px;overflow-y:auto;background:#1d2840;padding:14px 10px 30px;z-index:30}
#side .h{font:800 11px Inter;letter-spacing:.12em;color:#8e9bb5;margin:16px 10px 6px;text-transform:uppercase}
#side a{display:block;color:#d5dced;text-decoration:none;font-size:13.5px;padding:6px 10px;border-radius:7px}
#side a:hover{background:#ffffff12}#side a.active{background:#f0a42926;color:#ffc25c;font-weight:700}
#side a small{color:#8e9bb5;font-family:Inter;margin-left:4px}
main{margin:54px 0 0 236px;padding:26px 34px 80px;max-width:1240px}
section{scroll-margin-top:66px}
/* Generic */
h2.sec{font-size:24px;margin:34px 0 4px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
h2.sec .min{font:700 12px Inter;color:var(--amber);background:var(--amber-bg);border-radius:99px;padding:2px 10px}
.sub{color:var(--muted);margin:0 0 14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin:12px 0}
.card h3{margin:0 0 10px;font-size:16px}.card{overflow-x:auto}#words table{min-width:640px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:12px;color:var(--muted);font-weight:700;background:var(--soft)}
.tag{display:inline-block;font:800 11px Inter;border-radius:6px;padding:2px 8px}
.t-意思題{background:var(--blue-bg);color:var(--blue)}.t-公式題{background:var(--purple-bg);color:var(--purple)}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:99px;padding:2px 10px;background:var(--soft);border:1px solid var(--line)}
.note{border-left:4px solid var(--amber);background:var(--amber-bg);border-radius:0 10px 10px 0;padding:10px 14px}
.warn{border-left:4px solid var(--red);background:var(--red-bg);border-radius:0 10px 10px 0;padding:10px 14px}
.formula{border:2px solid var(--purple);background:var(--purple-bg);border-radius:10px;padding:10px 14px}.formula b{font:700 16px Inter,"Noto Sans TC";color:#3e2378;display:block}.formula span{font-size:13px;color:var(--muted)}
.board{font:13px/1.65 "JetBrains Mono","Noto Sans TC",monospace;white-space:pre-wrap;background:#1f2a1f;color:#e8f3e1;border-radius:10px;padding:12px 14px;border:6px solid #7a5a3a}
.lbl{font:800 11px Inter,"Noto Sans TC";letter-spacing:.08em;color:var(--faint);margin:0 0 6px;text-transform:uppercase}
.blank{color:var(--amber);font-weight:800;white-space:nowrap}
/* Overview */
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;counter-reset:f}
.flow div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:13px 14px;position:relative}
.flow div::before{counter-increment:f;content:counter(f);position:absolute;top:12px;right:12px;width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:800 12px Inter}
.flow b{display:block;font:800 15px Inter,"Noto Sans TC"}.flow small{display:block;color:var(--faint);font:700 11px Inter;margin-bottom:4px}.flow p{margin:4px 0 0;font-size:13.5px;color:var(--muted)}
.keys td:first-child{white-space:nowrap}kbd{font:700 12px Inter;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 7px;background:#fff}
.bar{height:8px;border-radius:99px;background:var(--amber)}
/* Passage */
.story{list-style:none;margin:0;padding:0;display:grid;gap:7px;counter-reset:s}
.story li{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:var(--soft)}
.story li::before{counter-increment:s;content:counter(s);flex:none;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:800 11px Inter;margin-top:2px}
.story .t{flex:1}.story .sask{display:block;color:var(--amber);font-weight:700;font-size:13.5px}.story .exp{display:block;color:var(--green);font-weight:700;font-size:13.5px}
.story .qs{display:flex;gap:4px}.story .qs a{font:800 11px Inter;background:var(--amber);color:#fff;border-radius:5px;padding:1px 7px;text-decoration:none}
.article{font:15.5px/1.95 Georgia,serif}.article p{margin:0 0 10px}.article .article-blank{color:var(--amber);font-weight:800;background:var(--amber-bg);border-radius:4px;padding:0 4px}
.zhbox{margin-top:10px;background:var(--blue-bg);border-radius:10px;padding:10px 14px;font-size:14px;color:#173e5f}
.zhbox p{margin:0 0 6px}
/* Question */
.q{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin:18px 0;overflow:hidden;scroll-margin-top:66px}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:14px 20px;background:var(--navy);color:#fff}
.qhead .num{font:800 22px Inter}.qhead .ans{margin-left:auto;font:800 14px Inter;background:#2f9e6c;border-radius:8px;padding:4px 12px}
.qhead .min{font:700 12px Inter;color:#f0a429}
.slide{padding:16px 20px;border-top:1px solid var(--line)}
.slide>.st{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.slide>.st b{font:800 12px Inter;color:#fff;border-radius:6px;padding:2px 9px}
.slide>.st span{font-size:13px;color:var(--muted)}
.s1 .st b{background:#d68910}.s2 .st b{background:var(--blue)}.s3 .st b{background:var(--green)}.s4 .st b{background:var(--purple)}
.sentence{font:17px/1.8 Georgia,serif;background:var(--soft);border-left:4px solid var(--amber);border-radius:0 10px 10px 0;padding:10px 14px}
.zhline{color:var(--muted);font-size:13.5px;margin:5px 2px 10px}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.opt{border:1px solid var(--line);border-radius:9px;padding:7px 11px;font:600 15px Inter}.opt i{font-style:normal;color:var(--faint);margin-right:6px}
.opt.ok{border-color:var(--green);background:var(--green-bg);color:var(--green)}
.hints{margin:0;padding:0;list-style:none;display:grid;gap:6px;counter-reset:h}
.hints li{border:1px solid #c9def0;background:var(--blue-bg);border-radius:9px;padding:7px 11px;font-size:14px}
.hints li::before{counter-increment:h;content:"提示 " counter(h);font:800 11px Inter,"Noto Sans TC";color:var(--blue);margin-right:8px}
.reason td:first-child{white-space:nowrap;font-family:Inter;font-weight:700}.reason tr.ok td{background:var(--green-bg)}
.cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:12px}
.wcards{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.wcard{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--soft)}
.wcard .w{font:800 15px Inter;color:var(--amber)}.wcard .p{font:600 11px Inter;color:var(--faint);margin-left:5px}.wcard .z{font-weight:700;font-size:13.5px}
.wcard .e{font:14px/1.5 Georgia,serif;margin-top:3px}.wcard .ez{font-size:12.5px;color:var(--muted)}
.wcard.key{background:#fff}
.ask{border:1px dashed var(--blue);border-radius:10px;padding:8px 12px;margin-top:10px;font-size:14px}.ask b{color:var(--blue);margin-right:6px}
.drill{margin:0;padding-left:22px}.drill li{margin:4px 0}.drill .a{font:800 13px Inter;color:var(--green);background:var(--green-bg);border-radius:5px;padding:1px 7px;margin-left:8px}
.bankrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.bankrow span{border:1px solid var(--ink);border-radius:6px;padding:1px 9px;font:700 13px Inter}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}.compare div{border:2px dashed var(--purple);border-radius:9px;padding:7px 11px}.compare small{display:block;color:var(--muted)}
.qfoot{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px 20px;background:var(--soft);border-top:1px solid var(--line)}
.qfoot .take{font:700 15px Georgia,serif}
details.more summary{cursor:pointer;color:var(--blue);font-weight:700;font-size:13.5px}
@media(max-width:1100px){.wcards{grid-template-columns:repeat(2,1fr)}.cols3{grid-template-columns:1fr}.flow{grid-template-columns:1fr 1fr}}
@media(max-width:900px){#side{transform:translateX(-100%);transition:transform .2s}#side.open{transform:none}#menuBtn{display:block}main{margin-left:0;padding:20px 14px 60px}.grid2,.grid3,.qfoot,.compare{grid-template-columns:1fr}.opts{grid-template-columns:1fr 1fr}#top .now{display:none}}

.adv{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:2px 14px}.adv summary{cursor:pointer;font-weight:700;color:var(--purple);font-size:13.5px;padding:7px 0}.adv[open]{padding-bottom:12px}.adv p{margin:2px 0 4px}
.guesses{display:grid;gap:8px}.guess{border:1px solid var(--line);border-radius:10px;padding:2px 14px;background:#fff}.guess[open]{padding-bottom:14px}.guess>summary{cursor:pointer;display:flex;align-items:baseline;gap:10px;padding:9px 0;flex-wrap:wrap}.gw{font:800 16px Inter;color:var(--amber)}.gs{font:700 11px Inter;color:var(--faint)}.gm{font-weight:700}
.essay{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:1100px){.essay{grid-template-columns:1fr 1fr}}@media(max-width:600px){.essay{grid-template-columns:1fr}}
.say{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid transparent;border-radius:6px;padding:2px 6px;margin:-2px -6px;font:inherit;font-weight:700;cursor:pointer;text-align:left}.say svg{flex:none;opacity:.5}.say:hover{border-color:var(--line);background:var(--soft)}.say:hover svg,.say.on svg{opacity:1}.say.on{border-color:var(--amber);background:var(--amber-bg)}.say.en{font-weight:400;font-family:Georgia,serif}
@media print{#top,#side{display:none}main{margin:0;padding:0}.q,.card{break-inside:avoid}body{background:#fff}}

府認可它是一種高效率又環保的能源。","事實上，類似的計畫正在全世界 14. ___。比利時、挪威和瑞典等國家已經和當地企業合作，利用常被人討厭的掩埋場來取得能源，也賺取額外收入。然而，這個想法在台灣 15. ___ 被好好思考。無論如何，考慮到我們的垃圾量越來越多，這個計畫絕對值得考慮。"],"faq":"Q：spell disaster不是拼災難？A：此處spell是意味著、導致。<br>Q：tap into是敲打嗎？A：此處是開發、利用資源。<br>Q：detested？A：令人厭惡的，接近hated。","why":"學生容易被開頭的disaster、waste、detested定錨，沒有發現文章轉向廢物利用。","walk":["第一段｜人口密集都市產生大量垃圾；美國專家已想出能把垃圾轉化為有利資源的替代方法。","第二段｜有機物分解會釋出甲烷和二氧化碳；這些氣體可燃燒發電，美國政府也承認其能源潛力。","第三段｜類似計畫逐漸在全球普及；部分歐洲國家取得能源與收入，臺灣則尚未充分思考這種做法。"],"sentences":[[["In a densely populated metropolis,","在人口密集的大城市裡，"],["the collective output of waste","大家一起製造的垃圾"],["can spell disaster","可能造成災難"],["for both the government and the average public.","對政府和一般民眾都是。"]],[["While most household waste","雖然大部分家庭垃圾"],["either ends up in landfills","最後不是進了掩埋場"],["or burned up,","就是被燒掉，"],["experts in America","美國的專家"],["have 11. ___ an alternative","已經 ___ 一個替代方法"],["that can turn the waste even to our advantage.","可以把垃圾變成對我們有利的東西。"]],[["As garbage breaks down in landfills,","當垃圾在掩埋場分解時，"],["the organic materials","裡面的有機物質"],["release gases","會釋放氣體"],["such as methane and carbon dioxide,","例如甲烷和二氧化碳，"],["both of 12. ___ can be burned","這兩種 ___ 都可以燃燒"],["to generate enough electricity","來產生足夠的電"],["to meet the needs of common families.","滿足一般家庭的需要。"]],[["Such projects","這類計畫"],["have currently been in place","目前已經在實施"],["in nearly every state in the U.S.","在美國幾乎每一州"],["except Alaska and Hawaii.","除了阿拉斯加和夏威夷。"]],[["13. ___ is the potential of the landfill gas","掩埋場氣體的潛力是 ___"],["that it’s recognized","以至於它被認可"],["as an efficient and environmentally-friendly energy source","為高效率又環保的能源"],["by the American government.","（被美國政府認可）。"]],[["In fact,","事實上，"],["similar projects","類似的計畫"],["are 14. ___ worldwide.","正在全世界 ___。"]],[["Countries like Belgium, Norway and Sweden","像比利時、挪威、瑞典這些國家"],["have cooperated with local enterprises","已經和當地企業合作"],["in tapping into the often detested landfills","利用常被人討厭的掩埋場"],["for energy and also for extra revenue.","取得能源，也賺取額外收入。"]],[["However,","然而，"], ,"in view of our ever-increasing amounts of garbage","In view of the rain, the game was canceled.","考慮到下雨，比賽取消了。"]],"guesses":[{"word":"catch on","source":"Q14","sentence":"In fact, similar projects are _____ worldwide.","clue":"worldwide＋下一句列出多個採用計畫的國家","meaning":"逐漸普及；開始流行","script":{"open":"「先別拆catch和on。看worldwide，再看後面列出的國家。」","ask":"問：「這些國家證明計畫被偶然遇見，還是被更多地方採用？」預期：被更多地方採用。","wrong":"若選come across：「人可以偶然遇見文章，但project不會自己在全球偶遇。」","why":"學生依單字原義拆譯片語，沒有用主詞與後句例證判斷。","board":"catch on = become popular / gain acceptance\nThe method caught on worldwide.","bg":"catch on也可表示理解；主詞是idea或method時多指流行，主詞是人時可指理解。","deeper":"I finally caught on.在此是什麼？預期：我終於懂了。","faq":"Q：catch on可分開嗎？A：此義通常不分開。<br>Q：等於popularize嗎？A：popularize是及物動詞，使某物普及。<br>Q：作文可用嗎？A：可以，描述新做法逐漸被接受。"}}]},{"id":"B","label":"題組 B · 綜合測驗 16–20","title":"Dancer Sheu Fang-Yi 舞者許芳宜","story":[["許芳宜是在台灣長大、站上國際舞台的舞者。","",""],["她很早就想當舞者。父母強烈反對，她的態度很堅定。","16","「父母反對」和「她很堅定」，是順著還是相反？"],["有天分的舞者很多。她嚴格控制飲食、每天嚴格訓練。","17","她和別人不同的地方，是什麼樣的特質？"],["從青少年到成年，她對舞蹈的投入讓老師同學印象深刻，後來進入美國有名的舞團。","18","這麼長的時間，她的投入是什麼樣子？"],["她很傑出、很有名，但也遇過挫折。","19","「有名」和「有挫折」是什麼關係？"],["她自己開的舞團失敗了，還損失好幾百萬。之後，她在國內外推廣現代舞。","20","失敗之後，她放棄了嗎？"]],"answers":{"16":"相反（儘管反對，還是堅定）","17":"自律","18":"一直持續、很穩定","19":"相反（雖然有名，也有挫折）","20":"沒有放棄，還是繼續"},"article":"<p>Born and raised in Taiwan, dancer Sheu Fang-Yi is a sight to behold on the global stage. Sheu found her calling in dancing early on, and <span class=\"article-blank\">16. _____</span> strong opposition from her parents, she has been determined and resilient in her aspiration to become a dancer by profession.</p><p>There is never a shortage of dancers blessed with talent. What sets Sheu apart from others, however, is her <span class=\"article-blank\">17. _____</span> to put in the hard work to further her skills. She follows a diet with a nearly religious fervor as well as keeping a rigorous workout routine to stay fit. Sheu has impressed her mentors and peers with her <span class=\"article-blank\">18. _____</span> dedication to her art from adolescence to adulthood, winning a much-coveted spot in Martha Graham Dance Company in 1995, one of the most respected and celebrated dance companies in the U.S.</p><p>Outstanding and renowned <span class=\"article-blank\">19. _____</span> she is, she has her share of setbacks like anyone else in pursuit of a grand dream or ambition. The dance company she established single-handedly did not work out and she even terminated a number of contracts that cost her millions. <span class=\"article-blank\">20. _____</span>, she takes it upon herself to promote modern dance at home and abroad. We can surely expect to be amazed by more of her productions in the years to come.</p>","zh":["在台灣出生長大的舞者許芳宜，在國際舞台上令人驚豔。她很早就發現舞蹈是她的志向，16. ___ 父母強烈反對，她一直很堅定、很有韌性，努力成為職業舞者。","有天分的舞者從來不缺。然而，讓許芳宜和別人不一樣的，是她願意下苦功、提升技巧的 17. ___。她近乎虔誠地控制飲食，也維持嚴格的訓練習慣來保持身材。從青少年到成年，她對藝術 18. ___ 的投入，讓老師和同儕印象深刻；1995 年，她贏得瑪莎葛蘭姆舞團令人羨慕的一個位子，那是美國最受尊敬、最有名的舞團之一。","19. ___ 她很傑出又很有名，她也和任何追求遠大夢想的人一樣，遇過不少挫折。她一個人創立的舞團沒有成功，她甚至終止了好幾份合約，損失好幾百萬。20. ___，她主動扛起責任，在國內外推廣現代舞。未來幾年，我們一定可以期待被她更多的作品驚豔。"],"faq":"Q：calling是打電話？A：此處指天職。<br>Q：a sight to behold？A：值得觀看、令人驚嘆。<br>Q：did not work out是沒運動？A：此處表示沒有成功。","why":"學生看到成功人物便預設成功原因是talent，忽略however所建立的反轉。","walk":["第一段｜她很早找到舞蹈志向；即使父母強烈反對，仍堅定而有韌性地朝職業舞者前進。","第二段｜天分並不稀有；使她不同的是自律、嚴格飲食、規律訓練與長期一致的投入。","第三段｜即使傑出知名，她仍遭遇舞團失敗與鉅額損失；儘管如此，仍主動推廣現代舞。"],"sentences":[[["Born and raised in Taiwan,","在台灣出生、長大，"],["dancer Sheu Fang-Yi","舞者許芳宜"],["is a sight to behold","是令人驚豔的存在"],["on the global stage.","在國際舞台上。"]],[["Sheu found her calling in dancing early on,","許芳宜很早就發現跳舞是她的志向，"],["and 16. ___ strong opposition from her parents,","而且 ___ 父母強烈反對，"],["she has been determined and resilient","她一直很堅定、很有韌性"],["in her aspiration to become a dancer by profession.","朝著成為職業舞者的目標前進。"]],[["There is never a shortage of dancers","從來不缺舞者"],["blessed with talent.","（有天分的那種）。"]],[["What sets Sheu apart from others, however,","然而，讓許芳宜和別人不一樣的"],["is her 17. ___","是她的 ___"],["to put in the hard work", rt from others","Her kindness sets her apart from others.","她的善良使她與眾不同。"],["rigorous","adj.","嚴格的","a rigorous workout routine","The training program is rigorous.","這個訓練計畫很嚴格。"],["stay fit","phr.","保持健康身材","keep a workout routine to stay fit","I swim every week to stay fit.","我每週游泳來保持健康。"],["mentor","n.","導師","impressed her mentors and peers","My mentor gave me useful advice.","我的導師給了我有用的建議。"],["dedication","n.","奉獻；投入","dedication to her art","We thank the nurses for their dedication.","我們感謝護理師的投入。"],["renowned","adj.","有名的","outstanding and renowned","The city is renowned for its night markets.","這座城市以夜市聞名。"],["setback","n.","挫折","have her share of setbacks","Losing the game was a big setback for the team.","輸掉比賽是球隊的一大挫折。"],["in pursuit of","phr.","追求","in pursuit of a grand dream","He moved to Tokyo in pursuit of his dream.","他為了追求夢想搬到東京。"],["terminate","v.","終止","terminated a number of contracts","The company terminated the contract early.","公司提前終止了合約。"],["take it upon oneself to V","phr.","主動承擔……","takes it upon herself to promote modern dance","He took it upon himself to clean the classroom.","他主動負責打掃教室。"],["at home and abroad","phr.","國內外","promote modern dance at home and abroad","The band is popular at home and abroad.","這個樂團在國內外都很受歡迎。"]],"guesses":[{"word":"calling","source":"Q16","sentence":"Sheu found her calling in dancing early on.","clue":"後文說她立志成為職業舞者，並長期投入","meaning":"天職；深信自己應投入的志業","script":{"open":"「calling在這裡不是電話。後面一直談職業舞者與人生投入。」","ask":"問：「她只是接到一通電話，還是很早找到人生方向？」預期：人生方向。","wrong":"若答電話：「把意思放回後文aspiration to become a dancer，電話無法串起全文。」","why":"學生遇到熟字多義時會自動套最早學會的中文。","board":"find one’s calling\n= discover the work one feels meant to do","bg":"calling可指強烈的使命感或天職，人物傳記與生涯主題常見。","deeper":"請用find one’s calling造句描述一個職業。","faq":"Q：等於job嗎？A：不完全；calling多使命感。<br>Q：只能宗教用嗎？A：也常用於職涯。<br>Q：可數嗎？A：常說a calling。"}},{"word":"work out","source":"Q20","sentence":"The dance company she established single-handedly did not work out.","clue":"後面說終止合約並損失數百萬，顯示計畫失敗","meaning":"成功；產生理想結果","script":{"open":"「這裡沒有健身房。後面是終止合約、損失數百萬。」","ask":"問：「舞團did not work out表示沒運動，還是事情沒成功？」預期：沒成功。","wrong":"若答運動：「主詞是dance company，不是她的身體；後句又提供失敗結果。」","why":"學生只記得workout名詞『健身』，沒有辨認work out片語動詞的多義。","board":"work out (phr.v.) = succeed / develop well\nworkout (n.) = exercise session","bg":"work out也可表示算出、解決或鍛鍊；需由主詞與受詞判斷。","deeper":"The plan worked out well.如何翻譯？預期：計畫進展／結果良好。","faq":"Q：workout為何連寫？A：名詞通常連寫。<br>Q：work out可指算答案嗎？A：可以。<br>Q：本題同義字？A：succeed。"}}]}],"questions":[{"n":11,"p":"A","type":"意思題","answer":"devised","options":["devised","endured","fetched","hastened"],"block":["experts in America have ___ an alternative","美國專家已經 ___ 一個替代方法"],"words":[["devise","v.","想出；設計","She devised a new way to remember words.","她想出一個背單字的新方法。"],["endure","v.","忍受","I can’t endure the noise anymore.","我再也受不了這個噪音了。"],["fetch","v.","去拿來","Can you fetch me a glass of water?","你可以去幫我拿一杯水嗎？"],["hasten","v.","加快","We hastened our steps when it started to rain.","開始下雨時，我們加快了腳步。"]],"quiz":{"bank":["devised","endure","fetch","hasten"],"items":[["The dog ran to ___ the ball.","fetch"],["Smoking can ___ aging.","hasten"],["The teacher ___ a fun game for the class.","devised"],["He had to ___ the pain after the accident.","endure"]]},"keys":[["alternative","n.","替代方案；另一個選擇","If the bus is late, take the MRT as an alternative.","公車誤點的話，可以改搭捷運。"],["household","adj.","家庭的","We recycle our household waste.","我們會回收家裡的垃圾。"],["landfill","n.","垃圾掩埋場","Too much trash goes to landfills.","太多垃圾被送去掩埋場。"]],"hints":["空格後面是 an alternative（一個替代方法）。專家對「一個方法」可以做什麼事？","把四個選項的中文，一個一個放進去念：「專家已經 ___ 一個方法」。","「忍受一個方法」和「去拿一個方法」都說不通。剩下兩個，哪個通？"],"explain":"devise an alternative 是「想出一個替代方法」。endure 是忍受、fetch 是去拿東西、hasten 是加快速度，都不能用在「方法」上。四個選項都是 -ed，所以這題只靠意思，不用講完成式。","trap":"學生可能選 fetched，以為是「找來一個方法」。fetch 是把東西拿過來，例如狗撿球，不能用在方法或點子。","formula":null,"takeaway":["devise a plan","想出一個計畫"],"sentence":"While most household waste either ends up in landfills or burned up, experts in America have _____ an alternative that can turn the waste even to our advantage.","zhFull":"雖然多數家庭垃圾最後不是進入掩埋場，就是被焚燒，美國專家已經設計出另一種能把垃圾轉化為有利資源的方法。","answerIdx":0,"reasons":["devised與alternative形成自然搭配，語意完整。","endure是忍受，常接hardship或pain，不能表示想出方案。","fetch是取來或賣得某價格，不能表示設計方案。","hasten是加速，常接process或change，不能接alternative表示創造。"],"family":[["devise","v. 設計；想出","device n. 裝置","Scientists devised a new method."],["alternative","n. 替代方案；adj. 替代的","alternatively adv. 或者","We need an alternative to plastic."],["endure","v. 忍受；持續","endurance n. 耐力","She endured years of hardship."],["hasten","v. 加速","haste n.; hasty adj.","The policy hastened the change."]],"syn":[["devise","經思考設計方法或策略","They devised a plan to reduce waste."],["invent","創造先前不存在的器具或技術","Bell invented the telephone."],["develop","經一段時間發展、改善","The team developed a new system."],["formulate","正式制定政策或理論","The government formulated a policy."]],"coll":["devise an alternative｜設計替代方案","household waste｜家庭垃圾","end up in landfills｜最後進入掩埋場","turn something to one’s advantage｜把某事轉為有利"],"board":"devise + plan / strategy / method / alternative\ndevice (n.) 裝置\ndevise (v.) 設計、想出","wrong":"若選endured：「alternative是痛苦，還是被設計出來的方法？」","faq":"Q：devise和device有關嗎？A：字源相關，但devise是動詞，device是名詞。","bg":"devise常搭抽象方案；invent偏新器具，develop偏逐步發展。大考用近義字干擾時要看受詞。","deeper":"若受詞改成一台新機器，invent和devise哪個更直覺？預期：invent。","minutes":7,"quizZh":["那隻狗跑去 ___ 球。","抽菸會 ___ 老化。","老師為全班 ___ 了一個有趣的遊戲。","車禍之後，他必須 ___ 疼痛。"],"star":"devise","personal":"你有沒有 devise 過一個背單字或準備考試的方法？用中文說也可以，再試著說：I devised ..."},{"n":12,"p":"A","type":"公式題","answer":"which","options":["them","those","which","what"],"block":["gases such as methane and carbon dioxide, both of ___ can be burned","氣體，例如甲烷和二氧化碳，這兩種 ___ 都可以燃燒"],"words":[["them","pron.","它們（受詞）","I have two cats. I love them.","我有兩隻貓，我很愛牠們。"],["those","pron.","那些","These shoes are mine. Those are yours.","這些鞋子是我的，那些是你的。"],["which","pron.","（把兩句接起來）那些東西","I have two cats, both of which are black.","我有兩隻貓，兩隻都是黑的。"],["what","pron.","什麼；……的東西","I don’t know what he wants.","我不知道他想要什麼。"]],"intro":"先比較這兩句：句號隔開用 them，逗號接起來用 which。","compare":[["I have two cats. Both of them are black.","兩句話，中間是句號"],["I have two cats, both of which are black.","一句話，中間是逗號"]],"quiz":{"bank":["them","which"],"items":[["She bought two bags. Both of ___ are red.","them"],["She bought two bags, both of ___ are red.","which"],["He has three bikes, all of ___ are new.","which"],["I have many friends. Some of ___ live in Tainan.","them"]]},"keys":[["release","v.","釋放；排出","The factory releases smoke into the air.","工廠把煙排到空氣中。"],["generate","v.","產生","Solar panels generate electricity.","太陽能板會發電。"],["organic","adj.","有機的","My mom buys organic vegetables.","我媽媽買有機蔬菜。"]],"hints":["找出逗號的位置。逗號前面那一段，是不是一句完整的話？","逗號後面還有動詞 can be burned。兩句話中間只有逗號、沒有 and，要用哪種字接起來？","哪一個字能把兩句話接起來，同時代表前面的兩種氣體？"],"explain":"逗號前是一句完整的話，逗號後的 can be burned 是第二句話。兩句之間沒有 and，要用 which 把兩句接起來，which 同時代表前面的甲烷和二氧化碳。them 和 those 沒有接句子的功能；what 不會放在逗號後面指前面的東西。","trap":"學生最常選 them，因為中文說「它們兩個都可以燒」很自然。提醒：英文兩句話之間沒有 and，就要用 which。","formula":["名詞, both of which + 動詞","……，這兩者都……","同類：all of which（全部都）、some of which（其中一些）"],"takeaway":["both of which","這兩者都"],"sentence":"...the organic materials release gases such as methane and carbon dioxide, both of _____ can be burned to generate enough electricity...","zhFull":"有機物會釋放甲烷和二氧化碳等氣體，這兩種氣體都可以燃燒發電。","answerIdx":2,"reasons":["them只能作代名詞，不能直接引導逗號後子句。","those是指示代名詞，不能在此引導關係子句。","which同時完成指代與連接功能。","what本身包含先行詞，前面不能已有明確名詞。"],"family":[["organic","adj. 有機的","organism n.; organically adv.","Organic waste can produce gas."],["release","v./n. 釋放","同形名詞與動詞","The material releases harmful gases."],["methane","n. 甲烷","methane gas","Methane can be used as fuel."],["generate","v. 產生","generation n.; generator n.","The plant generates electricity."]],"syn":[["generate","產生能源、收入或想法","The project generates extra revenue."],["produce","最通用的生產、產生","The factory produces equipment."],["emit","排放氣體、光或熱","Cars emit carbon dioxide."],["release","讓被包含的物質釋出","The waste releases methane."]],"coll":["organic materials｜有機物質","release gases｜釋放氣體","both of which｜兩者都","generate electricity｜發電","meet the needs of families｜滿足家庭需求"],"board":"both of them（名詞片語）\nN, both of which + V（關係子句）\n\nmethane and CO₂,\nboth of which can be burned","wrong":"若選them：「both of them很熟，但them不能單獨連接逗號後的子句。」","faq":"Q：為什麼不能what？A：what本身已含先行詞，前面不能再有明確名詞。","bg":"數量詞＋of which/whom是非限定關係子句常見結構，如many of whom、some of which。","deeper":"先行詞若是people，應寫many of which還是many of whom？預期：many of whom。","minutes":8,"quizZh":["她買了兩個包包。兩個都是紅色的。（兩句話）","她買了兩個包包，兩個都是紅色的。（一句話）","他有三台腳踏車，全部都是新的。","我有很多朋友。其中一些住在台南。"],"star":"which","personal":"你有沒有兩樣一樣的東西（兩支筆、兩雙鞋）？試著說：I have two ..., both of which are ..."},{"n":13,"p":"A","type":"公式題","answer":"Such","options":["So","Such","That","It"],"block":["___ is the potential of the landfill gas that it’s recognized as ...","掩埋場氣體的潛力是 ___，以至於它被認可為……"],"words":[["so","adv.","如此（後面接形容詞）","The soup is so hot that I can’t eat it.","湯燙到我沒辦法喝。"],["such","det.","如此（後面接名詞）","It was such a hot day that we stayed home.","那天熱到我們都待在家。"],["that","conj.","以至於（接在 so / such 後面）","He ran so fast that nobody could catch him.","他跑得快到沒人追得上。"],["it","pron.","它","I lost my pen. Have you seen it?","我的筆不見了，你有看到嗎？"]],"intro":"口訣：so 後面接形容詞，such 後面接名詞。","quiz":{"bank":["so","such","Such"],"items":[["He is ___ tired that he fell asleep in class.","so"],["It was ___ a good movie that I watched it twice.","such"],["The test was ___ easy that everyone passed.","so"],["___ is his talent that every team wants him.","Such"]]},"keys":[["potential","n.","潛力","This young player has great potential.","這個年輕球員很有潛力。"],["recognize","v.","認可；認出","I didn’t recognize you with short hair.","你剪短髮，我沒認出你。"],["efficient","adj.","有效率的","An efficient student finishes homework quickly.","有效率的學生很快就寫完作業。"],["environmentally friendly","adj.","環保的","Riding a bike is environmentally friendly.","騎腳踏車很環保。"]],"hints":["空格後面是 is the potential。potential 是什麼詞性？","句子後面有一個 that。想想「如此……以至於……」的兩種寫法。","so 接形容詞，such 接名詞。the potential 是哪一種？"],"explain":"Such is the potential ... that ... 意思是「潛力如此大，以至於……」。the potential 是名詞，所以用 such，不用 so。這句是倒裝，原本是 The potential is such that ...，學生背開頭的公式就好。It 填進去意思不通。","trap":"學生可能選 It，以為是 It is ... that 的句型，但填進去意思說不通。","formula":["Such is + 名詞 + that ...","名詞如此（大），以至於……","對比：so + 形容詞 + that"],"takeaway":["Such is the potential that ...","潛力如此大，以至於……"],"sentence":"_____ is the potential of the landfill gas that it’s recognized as an efficient and environmentally-friendly energy source by the American government.","zhFull":"掩埋場氣體的潛力如此巨大，以至於美國政府承認它是一種高效且環保的能源。","answerIdx":1,"reasons":["So通常接形容詞或副詞；So is the potential不完整。","Such可直接指涉前述程度，並與名詞potential配合。","That無法形成程度結果結構。","It is the potential的外形雖似強調句，但此處結構與語意不完整。"],"family":[["potential","n. 潛力；adj. 潛在的","potentially adv.","Solar power has great potential."],["recognize","v. 承認；辨認","recognition n.; recognizable adj.","The method is recognized as effective."],["efficient","adj. 有效率的","efficiency n.; efficiently adv.","This is an efficient system."],["environmental","adj. 環境的","environment n.; environmentally adv.","The project is environmentally friendly."]],"syn":[["potential","尚未完全實現的能力","The technology has enormous potential."],["possibility","某事發生的可能性","There is a possibility of rain."],["capacity","容量或完成某事的能力","The plant has the capacity to power 500 homes."],["recognize A as B","正式承認A具有B性質","The gas is recognized as an energy source."]],"coll":["the potential of landfill gas｜掩埋場氣體的潛力","have great potential｜具有巨大潛力","recognize A as B｜承認A是B","an efficient energy source｜高效率能源","environmentally friendly｜環境友善的"],"board":"Such is the potential that...\n= The potential is such that...\n\nSo great is the potential that...\n= The potential is so great that...","wrong":"若選So：「so後通常需要形容詞，例如So great is the potential。」","faq":"Q：作文需要使用倒裝嗎？A：不需要，The potential is so great that...已足夠。","bg":"這是正式修辭倒裝。學生作答只需辨識such...that；作文能用一般語序即可。","deeper":"若空格後改成great，再接is the potential，選so還是such？預期：So。","minutes":8,"quizZh":["他 ___ 累，以至於上課睡著了。","那部電影 ___ 好看，所以我看了兩次。","考試 ___ 簡單，所以每個人都及格了。","他的天分 ___ 高，以至於每支球隊都想要他。（名詞 talent 放在後面的特別句型）"],"star":"such","personal":"用 so ... that 說一句昨天的事：I was so tired that ..."},{"n":14,"p":"A","type":"意思題","answer":"catching on","options":["taking on","coming across","making up","catching on"],"block":["In fact, similar projects are ___ worldwide.","事實上，類似的計畫正在全世界 ___。"],"words":[["take on","phr.","接下；承擔（工作、責任）","She took on too much work this week.","她這週接了太多工作。"],["come across","phr.","偶然遇到；偶然發現","I came across an old photo in my drawer.","我在抽屜裡偶然發現一張舊照片。"],["make up","phr.","編造；組成","He made up a story about his dog eating his homework.","他編了一個狗吃掉他作業的故事。"],["catch on","phr.","流行起來","The new phone game caught on quickly at school.","那款新手遊很快在學校流行起來。"]],"quiz":{"bank":["take on","come across","make up","caught on"],"items":[["Did you ___ any new words in the article?","come across"],["Bubble tea has ___ all over the world.","caught on"],["Don’t ___ excuses. Tell me the truth.","make up"],["I am too busy to ___ another job.","take on"]]},"keys":[["similar","adj.","類似的","My sister and I have similar hobbies.","我和姊姊有類似的興趣。"],["worldwide","adv.","在全世界","This song is famous worldwide.","這首歌全世界都知道。"],["revenue","n.","收入；營收","The shop’s revenue went up this year.","這家店今年營收增加了。"]],"hints":["worldwide 是「全世界」。下一句提到了哪些國家？","很多國家都在做同一件事，中文會怎麼形容這件事？","把四個片語的中文放進去念：「類似的計畫正在全世界 ___」。"],"explain":"下一句列出比利時、挪威、瑞典都在做，代表這類計畫正在全世界流行，catch on 就是「流行起來」。計畫在全世界「接下、碰到、編造」都說不通。片語動詞要整組當一個單字背，不要拆開猜。","trap":null,"formula":null,"takeaway":["catch on","流行起來"],"sentence":"In fact, similar projects are _____ worldwide.","zhFull":"事實上，類似的計畫正在全球各地逐漸普及。","answerIdx":3,"reasons":["take on是承擔、呈現或雇用，不能表示計畫全球普及。","come across是偶然遇見或給人印象，主詞關係不合。","make up是組成、編造、和好或化妝，均不合。","catch on表示做法或觀念逐漸受到接受。"],"family":[["catch on","phr.v. 流行；理解","過去式caught on","The idea quickly caught on."],["worldwide","adv./adj. 全球地／全球的","world + wide","The product is sold worldwide."],["enterprise","n. 企業；事業","enterprising adj."," et to"]]},"keys":[["however","adv.","然而（後面講相反的事）","I wanted to go out. However, it rained.","我想出門，然而下雨了。"],["be worth + V-ing","phr.","值得做某事","This book is worth reading.","這本書值得一讀。"]],"hints":["However 是什麼意思？前一段說全世界的情況怎樣？","「然而」後面會講相反的事。台灣的情況會是什麼？","最後一句說這個計畫 worth considering（值得考慮）。台灣做了沒？"],"explain":"前面說全世界都在做，However 轉折，台灣「還沒」認真考慮，最後一句「值得考慮」也證明台灣還沒做。has yet to 是「還沒」。","trap":"has yet to 裡面有 has 和 yet，學生會以為是「已經」，其實是「還沒」。","formula":["have / has yet to + 原形動詞","還沒……","= have not + 過去分詞 + yet"],"takeaway":["has yet to be solved","還沒被解決"],"sentence":"However, the idea _____ be given much thought in Taiwan.","zhFull":"然而，這個構想在臺灣尚未受到充分思考與重視。","answerIdx":1,"reasons":["is supposed to只表應該或預定，未清楚表達截至目前尚未做。","has yet to準確表示目前仍未完成。","might as well表沒有更好選擇時不妨，主詞關係不合。","had better表最好，不能用來客觀描述臺灣現況。"],"family":[["have yet to","phr. 尚未","= have not...yet","The problem has yet to be solved."],["consider","v. 考慮","consideration n.; considerate/considerable adj.","The proposal is worth considering."],["increasing","adj. 不斷增加的","increase v./n.; increasingly adv.","We face increasing amounts of waste."],["amount","n. 數量","an amount of + 不可數名詞","A large amount of waste is produced."]],"syn":[["have yet to","正式表示截至目前尚未完成","The results have yet to be announced."],["have not...yet","最直接的尚未","We have not received the report yet."],["remain to be","尚待處理或確認","The cause remains to be determined."],["be supposed to","按規定、期待或安排應該","The train is supposed to arrive at six."]],"coll":["give an idea much thought｜仔細思考構想","be given much thought｜受到充分思考","have yet to be considered｜尚未被考慮","be worth considering｜值得考慮","in view of｜鑑於","ever-increasing amounts of garbage｜持續增加的垃圾量"],"board":"has yet to + V\n= has not + p.p. + yet\n\nhas yet to be considered\n= has not been considered yet","wrong":"若選is supposed to：「它只表應該，沒有表達直到現在仍未做。」","faq":"Q：yet to一定表示未來會做？A：通常暗示仍可能或預期完成，重點是目前尚未。","bg":"have yet to常見於新聞與學術文章，語氣比have not...yet正式。","deeper":"「研究結果尚未公布」？The research results have yet to be announced.","minut  <div class="grid2" style="margin-top:12px"><div class="card"><h3>投影片按鍵</h3><table class="keys">
  <tr><td><kbd>←</kbd> <kbd>→</kbd></td><td>上一頁／下一頁</td></tr><tr><td><kbd>空白鍵</kbd></td><td>題目頁：揭曉答案。Practice 頁：一次揭曉一句。</td></tr>
  <tr><td><kbd>H</kbd></td><td>題目頁：出現下一個提示</td></tr><tr><td>中文 ON／OFF</td><td>文章、斷句、題目的中文。開一次後會保持到你關掉。</td></tr><tr><td>右上選單</td><td>直接跳到第幾題</td></tr></table></div>
 <div class="card"><h3>帶低程度學生的三個原則</h3><ol style="margin:0;padding-left:20px">
  <li><b>先讓學生選，不先講答案。</b>答錯時問「你選的字是什麼意思？放進去念念看」，讓他自己聽出哪裡不通。</li>
  <li><b>答對也要說理由。</b>避免猜對就過。</li>
  <li><b>單字用例句記。</b>每個字配一句簡單例句，再問一題和他生活有關的問題。</li></ol></div></div></section>`}

function passage(p){
 return `<section id="p${p.id}"><h2 class="sec">${esc(p.label)} <span class="min">12 分鐘</span></h2><p class="sub en">${esc(p.title)}</p>
 <div class="card"><h3>故事地圖（投影片）</h3><p class="sub" style="margin-top:-4px">橘色是投影片上問學生的問題，綠色是你期待的答案，只問不講。</p><ol class="story">${p.story.map(([t,q,ask])=>{const nums=q.split(' ').filter(Boolean);const exp=nums.map(n=>p.answers[n]).filter(Boolean).join('；');return `<li><span class="t">${esc(t)}${ask?`<span class="sask">問：${esc(ask)}</span>`:''}${exp?`<span class="exp">期待：${esc(exp)}</span>`:''}</span><span class="qs">${nums.map(n=>`<a href="#q${n}">${n}</a>`).join('')}</span></li>`}).join('')}</ol></div>
 <div class="card"><h3>完整文章（投影片）</h3><div class="article">${p.article}</div><div class="zhbox">${p.zh.map(z=>`<p>${blank(z)}</p>`).join('')}</div></div>
 <div class="grid2"><div class="card"><h3>斷句帶讀時，學生可能卡住的字</h3><p style="margin:0">${p.faq}</p></div>
 <div class="card"><h3>文章的轉折</h3><ul style="margin:0 0 8px;padding-left:20px">${p.walk.map(w=>`<li>${esc(w)}</li>`).join('')}</ul><div class="warn">${esc(p.why)}</div></div></div>${guessBlock(p)}${articleWords(p)}</section>`}
function articleWords(p){if(!p.artWords||!p.artWords.length)return '';return `<div class="card"><h3>文章值得學的單字片語</h3><p class="sub" style="margin-top:-4px">不是題目答案，但文章裡值得帶走的 ${p.artWords.length} 個字詞；走讀文章時順便教。</p><table><tr><th>單字／片語</th><th>詞性</th><th>中文</th><th>文中用法</th><th>例句</th></tr>${p.artWords.map(w=>`<tr><td><button type="button" class="say" data-w="${esc(w[0])}" onclick="speakWord(this)">${SPK}<span>${esc(w[0])}</span></button></td><td>${esc(w[1])}</td><td>${esc(w[2])}</td><td><i>${esc(w[3])}</i></td><td><button type="button" class="say en" data-w="${esc(w[4])}" onclick="speakWord(this)" style="font-weight:500">${SPK}<span>${esc(w[4])}</span></button><div class="sub" style="margin-top:2px">${esc(w[5])}</div></td></tr>`).join('')}</table></div>`}
function guessBlock(p){if(!p.guesses.length)return '';return `<div class="card"><h3>難字猜測：看不懂的字，從上下文猜</h3>${p.id==='A'?'<p class="sub" style="margin-top:-4px">catch on 是第 14 題的答案，等第 14 題講完再用這張。</p>':'<p class="sub" style="margin-top:-4px">這兩個字不是答案，可以在斷句帶讀時順便用。</p>'}<div class="guesses">${p.guesses.map(g=>`<details class="guess"><summary><span class="gw">${esc(g.word)}</span><span class="gs">${esc(g.source)}</span><span class="gm">${esc(g.meaning)}</span></summary><div class="sentence" style="margin:8px 0">${blank(g.sentence)}</div><p class="lbl">線索</p><p style="margin:0 0 8px">${esc(g.clue)}</p><p class="lbl">怎麼問</p><p style="margin:0">${esc(g.script.open)}</p><p style="margin:4px 0 8px">${esc(g.script.ask)}</p><p class="lbl">學生猜錯時</p><div class="note" style="margin-bottom:8px">${esc(g.script.wrong)}</div><div class="board">${esc(g.script.board)}</div><details class="adv"><summary>給程度好的學生</summary><p>${esc(g.script.bg)}</p><div class="ask"><b>追問</b>${esc(g.script.deeper)}</div></details></details>`).join('')}</div></div>`}

function question(q){
 const take=q.takeaway;const n=q.n;
 return `<article class="q" id="q${n}"><div class="qhead"><span class="num">${n}</span><span class="tag t-${q.type}">${q.type}</span><span class="min">建議 ${q.minutes} 分鐘</span><span class="ans">答案 ${L[q.answerIdx]}　${esc(q.answer)}</span></div>
 <div class="slide s1"><div class="st"><b>1 · Question</b><span>學生先自己選，卡住才給提示</span></div>
  <div class="grid2"><div><div class="sentence">${blank(q.sentence)}</div><div class="zhline">${esc(q.zhFull)}</div>
   <div class="opts">${q.options.map((o,i)=>`<div class="opt${i===q.answerIdx?' ok':''}"><i>${L[i]}</i>${esc(o)}</div>`).join('')}</div></div>
   <div><p class="lbl">提示順序（H 鍵）</p><ol class="hints">${q.hints.map(h=>`<li>${blank(h)}</li>`).join('')}</ol><p class="lbl" style="margin-top:12px">學生答錯時</p><div class="note">${esc(q.wrong)}</div></div></div>
  <p class="lbl" style="margin-top:14px">揭曉後怎麼講</p><p style="margin:0 0 10px">${esc(q.explain)}</p>
  <table class="reason"><tr><th style="width:150px">選項</th><th>為什麼對／為什麼不對</th></tr>${q.options.map((o,i)=>`<tr class="${i===q.answerIdx?'ok':''}"><td>${L[i]}. ${esc(o)}</td><td>${esc(q.reasons[i])}</td></tr>`).join('')}</table>
  <div class="cols3">${q.trap?`<div><p class="lbl">學生常錯</p><div class="warn">${esc(q.trap)}</div></div>`:''}${q.formula?`<div><p class="lbl">公式卡</p><div class="formula"><b>${esc(q.formula[0])}</b>${esc(q.formula[1])}${q.formula[2]?`<br><span>${esc(q.formula[2])}</span>`:''}</div></div>`:''}<div><p class="lbl">板書</p><div class="board">${esc(q.board)}</div></div></div>
  <details class="adv"><summary>給程度好的學生</summary><p>${esc(q.bg)}</p><div class="ask"><b>追問</b>${esc(q.deeper)}</div></details></div>
 <div class="slide s2"><div class="st"><b>2 · Vocabulary</b><span>帶念例句，問「這句在講什麼？」</span></div>
  <div class="wcards">${q.words.map(w=>wcard(w)).join('')}</div>
  <p class="lbl" style="margin-top:12px">Key words</p><div class="wcards">${q.keys.map(w=>wcard(w,true)).join('')}</div>
  <div class="ask"><b>生活化提問</b>${esc(q.personal)}</div></div>
 <div class="slide s3"><div class="st"><b>3 · 單字補充</b><span>挑一兩個講就好</span></div>
  <div class="cols3" style="margin-top:0"><div><p class="lbl">字族／易錯</p><table>${q.family.map(f=>`<tr><td style="font-family:Inter;font-weight:700">${esc(f[0])}</td><td>${esc(f[2])}</td></tr>`).join('')}</table></div>
  <div><p class="lbl">近義字差別</p><table>${q.syn.map(s=>`<tr><td style="font-family:Inter;font-weight:700;white-space:nowrap">${esc(s[0])}</td><td>${esc(s[1])}<br><span class="en" style="color:var(--muted);font-size:13px">${esc(s[2])}</span></td></tr>`).join('')}</table></div>
  <div><p class="lbl">本題搭配詞</p><table>${q.coll.map(c=>{const [e,z]=c.split('｜');return `<tr><td class="en">${esc(e)}</td><td>${esc(z||'')}</td></tr>`}).join('')}</table></div></div></div>
 <div class="slide s4"><div class="st"><b>4 · Practice</b><span>學生先說，再按空白鍵揭曉</span></div>
  ${q.intro?`<p style="margin:0 0 8px;font-weight:700;color:var(--purple)">${esc(q.intro)}</p>`:''}${q.compare?`<div class="compare">${q.compare.map(c=>`<div><span class="en">${esc(c[0])}</span><small>${esc(c[1])}</small></div>`).join('')}</div>`:''}
  <div class="bankrow">${q.quiz.bank.map(b=>`<span>${esc(b)}</span>`).join('')}</div><ol class="drill">${q.quiz.items.map(([s,a],i)=>`<li><span class="en">${blank(s)}</span><span class="a">${esc(a)}</span>${q.quizZh&&q.quizZh[i]?`<br><span style="color:var(--muted);font-size:13px">${blank(q.quizZh[i])}</span>`:''}</li>`).join('')}</ol></div>
 <div class="qfoot"><div><p class="lbl">帶走一句（請學生抄下）</p><span class="take">${esc(take[0])}</span>　${esc(take[1])}</div><div><p class="lbl">學生可能會問</p>${esc(q.faq).replace(/&lt;br&gt;/g,'<br>')}</div></div></article>`}
function wcard(w,key){return `<div class="wcard${key?' key':''}"><span class="w">${esc(w[0])}</span><span class="p">${esc(w[1])}</span><div class="z">${esc(w[2])}</div><div class="e">${esc(w[3])}</div><div class="ez">${esc(w[4])}</div></div>`}

const SPK='<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
let sayingBtn=null;function speakWord(b){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();if(sayingBtn){sayingBtn.classList.remove('on');if(sayingBtn===b){sayingBtn=null;return}}const u=new SpeechSynthesisUtterance(b.dataset.w);u.lang='en-US';u.rate=.85;const v=speechSynthesis.getVoices();u.voice=v.find(x=>x.lang==='en-US')||v.find(x=>x.lang.startsWith('en'))||null;b.classList.add('on');sayingBtn=b;u.onend=u.onerror=()=>{b.classList.remove('on');if(sayingBtn===b)sayingBtn=null};speechSynthesis.speak(u)}
function wordList(){
 const rows=DATA.questions.flatMap(q=>[...q.words.map(w=>[q.n,w,true]),...q.keys.map(w=>[q.n,w,false])]);
 return `<section id="words"><h2 class="sec">本堂單字總表 <span class="min">${rows.length} 個</span></h2><p class="sub">★ 是正解。可以拿來出下次的小考。</p>
 <div class="card" style="padding:6px 12px"><table><tr><th>題</th><th>單字</th><th>詞性</th><th>中文</th><th>例句</th></tr>${rows.map(([n,w,opt])=>{const q=DATA.questions.find(x=>x.n===n);const star=opt&&w[0].toLowerCase()===q.star;return `<tr><td style="font-family:Inter;font-weight:700">Q${n}${star?' ★':''}</td><td><button type="button" class="say" data-w="${esc(w[0])}" onclick="speakWord(this)" style="color:${opt?'var(--amber)':'var(--ink)'}">${SPK}<span>${esc(w[0])}</span></button></td><td>${esc(w[1])}</td><td>${esc(w[2])}</td><td><button type="button" class="say en" data-w="${esc(w[3])}" onclick="speakWord(this)">${SPK}<span>${esc(w[3])}</span></button></td></tr>`}).join('')}</table></div></section>`}

function essayBank(){const n=DATA.essay.reduce((a,b)=>a+b[1].length,0);return `<section id="essay"><h2 class="sec">作文單字庫 <span class="min">${n} 個片語</span></h2><p class="sub">依主題整理，寫作文時挑適合的片語放進句子。</p><div class="essay">${DATA.essay.map(([t,items])=>`<div class="card" style="margin:0"><h3>${esc(t)}</h3><table>${items.map(([e,z])=>`<tr><td class="en">${esc(e)}</td><td style="color:var(--muted)">${esc(z)}</td></tr>`).join('')}</table></div>`).join('')}</div></section>`}
function nextQuiz(){
 return `<section id="quiz"><h2 class="sec">下次上課開場小考 <span class="min">10 分鐘</span></h2><p class="sub">每題一句，都出自這堂的 Practice，讓學生再寫一次。</p>
 <div class="grid2"><div class="card"><h3>題目（可以直接念或寫在黑板）</h3><ol class="drill">${DATA.questions.map(q=>{const it=q.quiz.items[q.quiz.items.length-1];return `<li><span class="en">${blank(it[0])}</span></li>`}).join('')}</ol></div>
 <div class="card"><h3>答案</h3><ol class="drill">${DATA.questions.map(q=>{const it=q.quiz.items[q.quiz.items.length-1];return `<li><span class="a" style="margin:0">${esc(it[1])}</span> <span style="color:var(--muted);font-size:13px">（第 ${q.n} 題）</span></li>`}).join('')}</ol></div></div></section>`}

const qs=id=>DATA.questions.filter(q=>q.n<=15===(id==='A'));
document.getElementById('root').innerHTML=overview()+DATA.passages.map(p=>passage(p)+qs(p.id).map(question).join('')).join('')+wordList()+essayBank()+nextQuiz();
const nav=[['課程',[['overview','課程總覽'],['flow','每題的上課流程']]],
 ...DATA.passages.map(p=>[p.label.split(' · ')[0]+' · '+(p.id==='A'?'11–15':'16–20'),[['p'+p.id,'故事地圖與文章'],...qs(p.id).map(q=>['q'+q.n,'第 '+q.n+' 題<small>'+esc(q.answer)+'</small>'])]]),
 ['收尾',[['words','本堂單字總表'],['essay','作文單字庫'],['quiz','下次開場小考']]]];
document.getElementById('side').innerHTML=nav.map(([h,items])=>`<div class="h">${h}</div>`+items.map(([id,t])=>`<a href="#${id}" data-id="${id}">${t}</a>`).join('')).join('');
document.querySelectorAll('#side a').forEach(a=>a.addEventListener('click',()=>document.getElementById('side').classList.remove('open')));
const links=[...document.querySelectorAll('#side a')];
function onScroll(){let cur=links[0];for(const a of links){const el=document.getElementById(a.dataset.id);if(el&&el.getBoundingClientRect().top<120)cur=a}links.forEach(a=>a.classList.toggle('active',a===cur));document.getElementById('nowLabel').innerHTML=cur.innerHTML.replace(/<small>.*<\/small>/,'')}
window.addEventListener('scroll',onScroll,{passive:true});onScroll();
let secs=0,tick=null;
function draw(){document.getElementById('timer').textContent=String(Math.floor(secs/60)).padStart(2,'0')+':'+String(secs%60).padStart(2,'0')}
function toggleTimer(){const b=document.getElementById('tBtn');if(tick){clearInterval(tick);tick=null;b.textContent='繼續'}else{tick=setInterval(()=>{secs++;draw()},1000);b.textContent='暫停'}}
function resetTimer(){clearInterval(tick);tick=null;secs=0;draw();document.getElementById('tBtn').textContent='開始'}
</script>
</body>
</html>
