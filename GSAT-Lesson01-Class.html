<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

.center-buttons{display:flex;flex-direction:column;align-items:center;gap:5px}.action-row{display:flex;gap:8px;align-items:center}#slide-type-label{font:11px "JetBrains Mono";color:#ffffff4d;letter-spacing:1px}

.zh-btn{background:#ffffff14;border:1px solid #ffffff26;color:#ffffff73;border-radius:8px;padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer}.zh-btn.on{background:#0ea5e926;border-color:#0ea5e966;color:#38BDF8}.zh-target.zh-hidden{display:none!important}

.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:stretch}.hero-card,.panel{background:#ffffff0b;border:1px solid #ffffff17;border-radius:14px;padding:22px}.hero-card h1{font-size:36px;line-height:1.25;margin-bottom:12px}.hero-card h1 span{color:var(--amber)}.hero-card p{color:#ffffffa8;font-size:16px}.hero-list{display:grid;gap:9px}.hero-item{background:#ffffff0b;border-left:3px solid var(--amber);padding:11px 13px;border-radius:0 8px 8px 0;font-size:14px}
.rule-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.rule-card{background:#ffffff0b;border:1px solid #ffffff17;border-radius:12px;padding:16px}.rule-number{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--amber);color:var(--navy);font:800 12px Inter;margin-bottom:8px}.rule-card strong{display:block;margin-bottom:5px}.rule-card p{font-size:13px;color:#ffffff91}
.q-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}.q-num{font:800 13px Inter;background:#ffffff1f;padding:4px 12px;border-radius:6px}.q-type-tag{font-size:12px;font-weight:700;background:#0ea5e926;color:#38BDF8;padding:4px 12px;border-radius:6px}.q-star{font-size:12px;font-weight:700;background:#f59e0b26;color:var(--amber);padding:4px 10px;border-radius:6px}

.answer-panel{display:none;background:#f59e0b14;border-left:3px solid var(--amber);border-radius:0 10px 10px 0;padding:12px 17px;font-size:14px;margin-top:13px}.answer-panel.show{display:block}.answer-panel strong{color:var(--amber)}
.supplement-head{display:flex;align-items:center;gap:10px;margin-bottom:15px}.answer-word{font:900 27px "JetBrains Mono";color:var(--amber)}.answer-meaning{font-size:16px;color:#ffffffb3}.mini-table,.summary-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:14px}.mini-table th,.mini-table td,.summary-table th,.summary-table td{padding:9px 11px;text-align:left;border-bottom:1px solid #ffffff12;vertical-align:top}.mini-table th,.summary-table th{font-size:11px;color:#ffffff63;text-transform:uppercase;letter-spacing:.5px}.mini-table .word,.summary-table .word{font:700 13px "JetBrains Mono";color:var(--amber)}.mini-table .correct-row{background:#0596691f}.tag{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;background:#0ea5e926;color:#38BDF8}
.note-card{margin:12px 0;background:#0ea5e91a;border:1px solid #38bdf856;border-radius:10px}.note-card summary{padding:11px 15px;color:#7dd3fc;font-size:13px;font-weight:800;cursor:pointer;list-style:none}.note-card summary::-webkit-details-marker{display:none}.note-card summary::after{content:" ＋";float:right}.note-card[open] summary::after{content:" －"}.note-card p{padding:0 15px 14px;color:#e0f2fe;font-size:14px;line-height:1.7}
.supplement-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.micro-card{background:#ffffff0b;border:1px solid #ffffff17;border-radius:10px;padding:13px 15px}.micro-card h3{font-size:12px;color:var(--sky);margin-bottom:6px}.micro-card p,.micro-card li{font-size:13px;color:#ffffffbd;line-height:1.65}.micro-card ul{padding-left:18px}.trap-box{background:#dc262614;border:1px solid #dc26262e}.trap-box h3{color:#F87171}.check-box{margin-top:12px;background:#f59e0b12;border:1px solid #f59e0b30;border-radius:10px;padding:13px 15px}.check-question{font-size:14px;font-weight:700}.check-answer{display:none;margin-top:8px;color:#34D399;font-weight:700}.check-answer.show{display:block}
.summary-table-wrap{max-height:510px;overflow:auto;background:#ffffff08;border:1px solid #ffffff14;border-radius:12px;padding:4px 14px}.summary-table{margin:0}.summary-table thead{position:sticky;top:0;background:var(--navy);z-index:2}
.bank-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bank-card{background:#ffffff0b;border:1px solid #ffffff17;border-radius:10px;padding:13px}.bank-card h3{font-size:13px;color:var(--amber);margin-bottom:6px}.bank-card ul{padding-left:18px;font-size:12px;color:#ffffffa8;line-height:1.75}
.practice-list{display:grid;gap:10px}.practice-item{background:#ffffff0b;border:1px solid #ffffff17;border-radius:10px;padding:13px 15px}.practice-question{font-size:14px}.practice-answer{display:none;color:#34D399;font-weight:700;margin-top:7px}.practice-answer.show{display:block}
.article-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.article-meta span{font-size:11px;background:#0ea5e926;color:#38BDF8;padding:4px 9px;border-radius:999px}.article-text{background:#ffffff0b;border:1px solid #ffffff17;border-radius:12px;padding:18px 20px;font:14px/1.9 Georgia,serif;color:#ffffffd9;max-height:440px;overflow:auto}.article-text p+p{margin-top:13px}.article-blank{color:var(--amber);font-weight:800;background:#f59e0b20;padding:1px 5px;border-radius:4px}.article-zh{margin-top:10px;background:#0ea5e912;border-left:3px solid var(--sky);padding:11px 14px;border-radius:0 8px 8px 0;color:#ffffffa8;font-size:12px;line-height:1.75}
.wordbank-card{margin-top:14px;background:#ffffff0b;border:1px solid #ffffff21;border-radius:14px;padding:15px 18px}.wordbank-card-title{font:800 11px "JetBrains Mono";color:var(--amber);letter-spacing:1px;margin-bottom:9px}.wordbank-grid{display:grid;grid-template-columns:repeat(2,1fr);column-gap:24px}.wordbank-choice{display:flex;align-items:center;gap:9px;padding:8px 4px;border-bottom:1px solid #ffffff12;font:600 14px Inter,sans-serif;transition:.18s}.wordbank-choice-label{color:var(--amber);font:800 11px "JetBrains Mono";width:20px}.wordbank-choice.correct{color:#6EE7B7;font-weight:900}.wordbank-choice.dimmed{opacity:.28}
@media(max-width:760px){#topbar{padding:0 12px}.top-title,.progress-wrap{display:none}#slide-area{padding:18px 14px 10px}#bottombar{padding:0 10px}.nav-btn{padding:9px 11px;font-size:12px}.action-btn{padding:9px 13px}.hero,.rule-grid,.q-options,.supplement-grid,.bank-grid,.wordbank-grid{grid-template-columns:1fr}.hero-card h1{font-size:28px}.slide-title{font-size:22px}.q-sentence{font-size:16px}.summary-table-wrap{overflow:auto}.summary-table{min-width:720px}}
</style>

<script>
const questionData=[
{num:1,type:'人物角色＋搭配',sentence:'Once a new product is launched, sales _____ will send samples to potential customers and then go on to give public demonstrations to promote their products.',zh:'新產品上市後，業務代表會將樣品寄給潛在客戶，接著進行公開示範以推廣產品。',options:['contestants','pessimists','participants','representatives'],answer:3,key:'sales representative 是固定職稱；寄樣品、公開示範、推廣產品都是代表公司的銷售工作。',vocab:[['contestant','n.','參賽者','contestant in a competition'],['pessimist','n.','悲觀的人','a hopeless pessimist'],['participant','n.','參與者','participant in a program'],['representative','n.','代表；業務代表','sales representative']],family:'represent → representation / representative；participate → participant / participation',syn:'representative / delegate / spokesperson / agent',collocations:['sales representative','send samples to potential customers','give a public demonstration'],trap:'不要因為此人「參與」推廣就選 participant；sales representative 才是職稱。',check:['「研討會的參與者」應選 participant 還是 representative？','participant；常見搭配 participant in a seminar。']},
{num:2,type:'動詞搭配',sentence:'The board of directors did not seem satisfied with the original proposal and they are likely to _____ to it in the meeting tomorrow.',zh:'董事會似乎不滿意原提案，因此很可能在明天的會議中反對它。',options:['conform','resort','intend','object'],answer:3,key:'object to the proposal＝反對提案；did not seem satisfied 是最直接的語意線索。',vocab:[['conform','v.','遵從；符合','conform to rules'],['resort','v.','訴諸；求助於','resort to legal action'],['intend','v.','打算；意圖','intend to revise'],['object','v.','反對','object to a proposal']],family:'object → objection / objectionable；intend → intention / intentional',syn:'object to / oppose / be against / protest against',collocations:['object to a proposal','oppose a proposal','resort to legal action'],trap:'likely to 後確實接原形，但不能說 intend to it；object to 中的 to 是介系詞。',check:['把 object to the proposal 改成 oppose，怎麼寫？','oppose the proposal；oppose 後面不加 to。']},
{num:3,type:'副詞語意',sentence:'The chef here is _____ the best in the area. That is why you need to make a reservation at least three months in advance to get a table.',zh:'這裡的主廚可以說是這一帶最好的，因此至少要提前三個月訂位。',options:['barely','arguably','reasonably','technically'],answer:1,key:'提前三個月訂位是強證據，因此可合理地主張主廚是本區最佳：arguably the best。',vocab:[['barely','adv.','幾乎不；勉強','barely enough'],['arguably','adv.','可以說；可合理地主張','arguably the best'],['reasonably','adv.','合理地；相當地','reasonably priced'],['technically','adv.','技術上；嚴格而言','technically correct']],family:'argue → argument → arguable → arguably',syn:'arguably / it could be argued that / justifiably',collocations:['arguably the best','make a reservation','three months in advance'],trap:'不熟 arguably 時別自動選熟字 reasonably；先用 That is why 後方證據判斷。',check:['「這可以說是最有效的方法」如何用 arguably 表達？','This is arguably the most effective method.']},
{num:4,type:'形容詞搭配',sentence:'To look after her ailing father, she quit her job as a professor at Harvard University, ending a(n) _____ academic career.',zh:'為照顧生病的父親，她辭去哈佛教授工作，也結束了一段傑出的學術生涯。',options:['distinguished','accessible','subjective','conditional'],answer:0,key:'distinguished academic career＝傑出且受敬重的學術生涯；Harvard professor 提供成就背景。',vocab:[['distinguished','adj.','傑出的；卓越的','distinguished career'],['accessible','adj.','可接近、取得或理解的','accessible to'],['subjective','adj.','主觀的','subjective opinion'],['conditional','adj.','有條件的','conditional approval']],family:'distinguish → distinction / distinguished / distinct / distinctive',syn:'distinguished / outstanding / eminent / renowned',collocations:['look after an ailing parent','distinguished academic career','distinguish A from B'],trap:'distinguished 是成就傑出；distinctive 是具有辨識特色，兩者不可互換。',check:['「有辨識度的聲音」用 distinguished 還是 distinctive？','a distinctive voice。']},
{num:5,type:'語意呼應',sentence:'Since this course will cover only the _____ concepts of the subject, it is recommended for beginners who want to lay a solid foundation for their studies.',zh:'這門課只涵蓋基礎概念，因此推薦給想打穩基礎的初學者。',options:['fundamental','imaginary','optional','distinctive'],answer:0,key:'beginners 與 lay a solid foundation 共同指向 fundamental concepts。',vocab:[['fundamental','adj.','基礎的；根本的','fundamental concepts'],['imaginary','adj.','想像中的；虛構的','imaginary friend'],['optional','adj.','可選擇的；非必修的','optional course'],['distinctive','adj.','有特色的；容易辨認的','distinctive feature']],family:'found → foundation / fundamental / fundamentally；imagine → imagination / imaginary / imaginative',syn:'fundamental / basic / elementary / underlying',collocations:['fundamental concepts','lay a solid foundation','recommended for beginners'],trap:'看到 course 不代表答案是 optional；後文 beginner＋foundation 是雙重提示。',check:['把 fundamental concepts 換成一個較基礎的同義詞。','basic concepts。']},
{num:6,type:'抽象名詞',sentence:'Students without a clear set of _____ in mind usually find it difficult to manage their time well because they have no idea about what is important to them.',zh:'沒有明確優先順序的學生往往難以管理時間，因為他們不知道什麼最重要。',options:['disputes','judgments','priorities','viewpoints'],answer:2,key:'what is important 對應應該優先處理的事項；set priorities＝設定優先順序。',vocab:[['dispute','n.','爭議；爭端','settle a dispute'],['judgment','n.','判斷；判斷力','make a judgment'],['priority','n.','優先事項','set priorities'],['viewpoint','n.','觀點','from my viewpoint']],family:'prior → priority / priorities / prioritize',syn:'priority / chief concern / first consideration',collocations:['set clear priorities','give priority to safety','prioritize important tasks'],trap:'priority 的複數是 priorities，不是 prioritys；judgment 是判斷，不是重要事項排序。',check:['「我們必須優先考慮安全」用 prioritize 怎麼寫？','We must prioritize safety.']},
{num:7,type:'感受搭配',sentence:'I shared her _____ after we read the letters from our depressed friend. We both regretted not sparing enough time to keep her company.',zh:'讀完情緒低落朋友的信後，我和她有相同感受；我們都後悔沒有多陪伴朋友。',options:['sentiments','profiles','terminals','tributes'],answer:0,key:'We both regretted 表示兩人有相同感受；share someone’s sentiments＝認同某人的感受。',vocab:[['sentiment','n.','感受；態度；看法','share someone’s sentiments'],['profile','n.','個人簡介；側面輪廓','user profile'],['terminal','n.','航廈；終端機','airport terminal'],['tribute','n.','敬意；致敬','pay tribute to']],family:'sentiment → sentimental → sentimentally',syn:'sentiment / feeling / emotion / attitude',collocations:['share someone’s sentiments','keep someone company','spare time to help'],trap:'不要因 depressed 自行補出死亡或紀念情境；tribute 要搭配 pay tribute to。',check:['I share your sentiments. 可以怎麼簡單改寫？','I feel the same way.']},
{num:8,type:'比較副詞',sentence:'Compared with other people facing the same dilemma, she is _____ optimistic about her chance to succeed in the long run.',zh:'和面臨相同困境的人相比，她對長期成功的機會相對樂觀。',options:['eventually','realistically','practically','relatively'],answer:3,key:'Compared with 建立比較基準；relatively optimistic＝相對樂觀。',vocab:[['eventually','adv.','最終；終於','eventually succeed'],['realistically','adv.','實際地；務實地','think realistically'],['practically','adv.','實際上；幾乎','practically impossible'],['relatively','adv.','相對地；比較而言','relatively optimistic']],family:'relate → relation / relationship / relative / relatively',syn:'relatively / comparatively',collocations:['face the same dilemma','relatively optimistic about','in the long run'],trap:'in the long run 容易把人拉去選 eventually；空格真正回應句首 Compared with。',check:['eventually 和 relatively 各表示哪一種功能？','eventually＝時間結果；relatively＝相對比較。']},
{num:9,type:'職務狀態',sentence:'His duty as a general manager is currently _____ until further investigation proves his innocence in the rumored scandal.',zh:'在進一步調查證明清白前，他目前的總經理職務已被暫停。',options:['suspended','confessed','sheltered','obsessed'],answer:0,key:'currently＋until 顯示調查期間的暫時狀態；be suspended from duty＝被停職。',vocab:[['suspend','v.','暫停；使停職','suspended from duty'],['confess','v.','承認；坦白','confess to a crime'],['shelter','v.','庇護；保護','shelter from danger'],['obsessed','adj.','著迷的','obsessed with']],family:'suspend → suspension / suspended；obsess → obsession / obsessed / obsessive',syn:'suspend / pause / halt',collocations:['be suspended from duty','conduct an investigation','prove one’s innocence'],trap:'scandal 只表示醜聞，不代表當事人已 confess；調查尚未證明結果。',check:['suspend 的名詞如何拼？','suspension；不是 suspendtion。']},
{num:10,type:'主受詞語意',sentence:'It seemed that the issue of water pollution did not _____ local residents, as few expressed their views or worries in the town meeting.',zh:'水污染議題似乎沒有引起居民擔憂，因為很少有人在市民大會表達意見或憂慮。',options:['illustrate','identify','discharge','concern'],answer:3,key:'concern＋人＝使某人擔憂；as 後的 worries 是直接呼應。',vocab:[['illustrate','v.','說明；圖解','illustrate a point'],['identify','v.','辨認；找出','identify the cause'],['discharge','v.','排放；准許離開','discharge waste'],['concern','v.','使擔憂；與……有關','concern residents']],family:'concern → concerned / concerning；identify → identification；illustrate → illustration',syn:'concern / worry / trouble',collocations:['concern local residents','be concerned about pollution','discharge waste into a river'],trap:'water pollution 會讓人聯想到 discharge，但工廠排放廢水；議題使居民擔憂。',check:['改成人作主詞：「居民擔心水污染。」','Residents are concerned about water pollution.']}

{type:'article',label:'綜合測驗 11–15',title:'Landfill Gas',theme:'垃圾掩埋場氣體轉化為能源',text:'<p>In a densely populated metropolis, the collective output of waste can spell disaster for both the government and the average public. While most household waste either ends up in landfills or burned up, experts in America have <span class="article-blank">11. _____</span> an alternative that can turn the waste even to our advantage.</p><p>As garbage breaks down in landfills, the organic materials release gases such as methane and carbon dioxide, both of <span class="article-blank">12. _____</span> can be burned to generate enough electricity to meet the needs of common families. Such projects have currently been in place in nearly every state in the U.S. except Alaska and Hawaii. <span class="article-blank">13. _____</span> is the potential of the landfill gas that it’s recognized as an efficient and environmentally-friendly energy source by the American government.</p><p>In fact, similar projects are <span class="article-blank">14. _____</span> worldwide. Countries like Belgium, Norway and Sweden have cooperated with local enterprises in tapping into the often detested landfills for energy and also for extra revenue. However, the idea <span class="article-blank">15. _____</span> be given much thought in Taiwan. In any case, the project is certainly worth considering in view of our ever-increasing amounts of garbage.</p>',zh:'在人口稠密的大都市中，集體產生的垃圾可能為政府及一般民眾帶來災難。多數家庭垃圾不是進入掩埋場，就是被焚燒；然而美國專家已想出另一種方法，甚至能將垃圾轉化為對我們有利的資源。<br><br>垃圾在掩埋場分解時，有機物會釋放甲烷與二氧化碳等氣體，兩者都能被燃燒以產生足夠家庭使用的電力。這類計畫目前幾乎已遍及美國各州。掩埋場氣體的潛力如此巨大，以至於美國政府承認它是一種高效且環保的能源。<br><br>類似計畫正在全球普及。比利時、挪威及瑞典等國已與當地企業合作，利用常遭嫌惡的掩埋場取得能源與額外收入。然而，這項構想在臺灣尚未受到充分思考。考量持續增加的垃圾量，此計畫確實值得考慮。'},
{type:'article',label:'綜合測驗 16–20',title:'Dancer Sheu Fang-Yi',theme:'許芳宜的自律、長期投入與韌性',text:'<p>Born and raised in Taiwan, dancer Sheu Fang-Yi is a sight to behold on the global stage. Sheu found her calling in dancing early on, and <span class="article-blank">16. _____</span> strong opposition from her parents, she has been determined and resilient in her aspiration to become a dancer by profession.</p><p>There is never a shortage of dancers blessed with talent. What sets Sheu apart from others, however, is her <span class="article-blank">17. _____</span> to put in the hard work to further her skills. She follows a diet with a nearly religious fervor as well as keeping a rigorous workout routine to stay fit. Sheu has impressed her mentors and peers with her <span class="article-blank">18. _____</span> dedication to her art from adolescence to adulthood, winning a much-coveted spot in Martha Graham Dance Company in 1995, one of the most respected and celebrated dance companies in the U.S.</p><p>Outstanding and renowned <span class="article-blank">19. _____</span> she is, she has her share of setbacks like anyone else in pursuit of a grand dream or ambition. The dance company she established single-handedly did not work out and she even terminated a number of contracts that cost her millions. <span class="article-blank">20. _____</span>, she takes it upon herself to promote modern dance at home and abroad. We can surely expect to be amazed by more of her productions in the years to come.</p>',zh:'在臺灣出生長大的舞者許芳宜，在全球舞台上是令人驚嘆的存在。她很早便找到舞蹈志向；儘管父母強烈反對，她仍堅定而有韌性地朝職業舞者目標前進。<br><br>有才華的舞者從來不缺。真正使她與眾不同的，是她願意投入苦練、持續精進技巧的自律。她近乎虔誠地控制飲食並維持嚴格訓練。從青少年到成年，她對藝術始終如一的投入令導師與同儕印象深刻，並於1995年取得Martha Graham Dance Company令人嚮往的名額。<br><br>儘管她傑出且享有盛名，追求遠大夢想時仍遭遇挫折。她獨力創立的舞團未能成功，也因終止合約損失鉅款。儘管如此，她仍主動承擔在國內外推廣現代舞的責任。'}

const boardNotes={"1": ["代表公司，不等於參加活動", "sales representative 是「業務代表」，替公司接洽客戶；participant 是「參與者」，例如 a participant in a competition。代表公司可說 represent a company。"], "2": ["兩種「反對」的接法", "object to the proposal 和 oppose the proposal 都是「反對提案」；object 後要接 to，oppose 直接接受詞。例：They objected to the plan.＝They opposed the plan."], "4": ["distinguished 與 distinctive", "distinguished 指因成就而「傑出、受敬重」，如 a distinguished professor；distinctive 指「有辨識度的」，如 a distinctive voice。"], "6": ["priority 的字族與搭配", "priority（優先事項）的複數是 priorities；set priorities＝設定優先順序；give priority to safety＝優先考慮安全；prioritize 是動詞「優先處理」。"], "7": ["感受與陪伴的實用說法", "share her sentiments＝認同她的感受；keep someone company＝陪伴某人。例：I stayed to keep her company. 我留下來陪她。"], "9": ["suspend 的詞形", "be suspended from duty＝被停職；名詞是 suspension。例：The officer was suspended pending an investigation."], "10": ["concern 的兩種主詞", "The issue concerns residents.＝這件事令居民擔憂；Residents are concerned about the issue.＝居民擔心這件事。注意主詞不同，句型也跟著變。"], "11": ["devise 與 device", "devise 是動詞「想出、設計」，常接 a plan / strategy / solution；device 是名詞「裝置」。例：They devised a plan to turn waste into energy."], "14": ["catch on 有兩個意思", "某個做法 catches on＝變得流行；人 catches on＝終於理解。例：The new method caught on quickly.／I finally caught on."], "15": ["has yet to 的意思", "has yet to be considered＝尚未被考慮，相當於 has not been considered yet。yet 在這裡表示事情到目前仍未發生。"], "17": ["discipline 與 regulation", "discipline 在本題指持續自律的能力：have the discipline to practice；regulation 指外部訂定的規定，如 safety regulations。"], "18": ["consistent 的字族", "consistent dedication＝始終如一的投入；名詞 consistency、副詞 consistently。例：She practiced consistently for years."], "21": ["lie 的兩組變化", "lie＝「位於／躺」時，過去式 lay、過去分詞 lain；lie＝「說謊」時，過去式和過去分詞都是 lied。本篇 behind the facades lies... 是「位於／存在」。"], "22": ["provide 的三種搭配", "provide for a family＝養家；provide a family with food＝供給家人食物；provide food for a family＝為家庭提供食物。本題需要「供養家人」，所以用 provide for。"], "27": ["chores 與 housework", "household chores 是一項項可數的家務，如洗碗、掃地；housework 是不可數的家務總稱。例：We share the household chores."], "28": ["assume 不只是假設", "assume a leadership role＝擔任領導職務；assume responsibility＝承擔責任；assume that... 才是「假設……」。"], "29": ["hard 與 hardly 意思不同", "work hard＝努力工作；hardly work＝幾乎不工作。本篇 could hardly advance 是「幾乎無法晉升／發展」。"], "30": ["witness 可以用地方作主詞", "witness 作動詞也能表示「經歷、見證變化」。Jeju witnessed a decrease in haenyeos＝濟州島經歷海女人數下降；這裡不是「目擊者」。"]};
const slides=[...introSlides,...teachingSlides,...clozeTeachingSlides,...wordBankTeachingSlides,...reviewSlides];
let current=0,revealed=false,zhVisible=false;
function applyZh(){document.querySelectorAll('.zh-target').forEach(element=>element.classList.toggle('zh-hidden',!zhVisible))}
function toggleZh(){zhVisible=!zhVisible;applyZh();const button=document.getElementById('zh-btn');button.textContent=zhVisible?'中文 ON':'中文 OFF';button.classList.toggle('on',zhVisible)}
function showButton(id,show){document.getElementById(id).classList.toggle('hidden',!show)}
function noteCard(item){if(!item)return '';const escape=value=>String(value).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;');return '<details class="note-card"><summary>NOTE · '+escape(item[0])+'</summary><p>'+escape(item[1])+'</p></details>'}
function render(){
const slide=slides[current],root=document.getElementById('slide-content');
revealed=false;
document.getElementById('progress-text').textContent=(current+1)+' / '+slides.length;
document.getElementById('progress-bar').style.width=Math.round((current+1)/slides.length*100)+'%';
document.getElementById('prev-btn').disabled=current===0;
document.getElementById('next-btn').disabled=current===slides.length-1;
const labels={intro:'課程首頁',strategy:'解題策略',article:'完整文章',question:'題目','wordbank-options':'共用選項','wordbank-question':'文意選填',supplement:'單字補充','vocab-summary':'單字總表',family:'單字家族',synonyms:'同義字群',collocations:'搭配詞','essay-bank':'作文單字庫',practice:'互動練習',end:'課程結束'};
document.getElementById('slide-type-label').textContent=labels[slide.type]||'';
showButton('zh-btn',slide.type==='question'||slide.type==='wordbank-question'||slide.type==='article');
showButton('reveal-btn',slide.type==='question'||slide.type==='wordbank-question'||slide.type==='practice');
resetRevealButton();
if(slide.type==='intro'){
root.innerHTML='<div class="slide-label">GSAT · Lesson 01</div><div class="hero"><div class="hero-card"><h1>學測題號 <span>1–30</span></h1><p>詞彙搭配 × 綜合測驗 × 文意選填</p></div><div class="hero-card hero-list"><div class="hero-item">30 題原文完整保留</div><div class="hero-item">三篇題組文章完整收錄</div><div class="hero-item">逐題後緊接單字、字族、近義字與搭配</div><div class="hero-item">答案可收合，中文翻譯預設隱藏</div></div></div>';
}else if(slide.type==='strategy'){
root.innerHTML='<div class="slide-label">Vocabulary Strategy</div><div class="slide-title">'+slide.title+'</div><div class="slide-subtitle">'+slide.subtitle+'</div><div class="rule-grid"><div class="rule-card"><div class="rule-number">1</div><strong>先看搭配</strong><p>sales representative、object to、lay a foundation。</p></div><div class="rule-card"><div class="rule-number">2</div><strong>找語意證據</strong><p>because、That is why、Compared with 等線索決定答案方向。</p></div><div class="rule-card"><div class="rule-number">3</div><strong>檢查主受詞</strong><p>不是「和主題有關」就能選，動作關係也必須合理。</p></div></div>';
}else if(slide.type==='article'){
root.innerHTML='<div class="slide-label">'+slide.label+'</div><div class="slide-title">'+slide.title+'</div><div class="article-meta"><span>'+slide.theme+'</span><span>完整文章原文</span></div><div class="article-text">'+slide.text+'</div><div class="article-zh zh-target">'+slide.zh+'</div>';
}else if(slide.type==='wordbank-options'){
const rows=[['A','provide for','動詞片語','供養；養活'],['B','primary','形容詞','主要的；首要的'],['C','chores','複數名詞','家務；例行雜務'],['D','colleagues','複數名詞','同事；同業者'],['E','witnessed','過去式／過去分詞','見證；經歷'],['F','assume','動詞','假設；承擔；擔任'],['G','reversed','過去分詞／形容詞','被顛倒的'],['H','initially','副詞','最初；起初'],['I','hardly','副詞','幾乎不'],['J','lies','動詞','位於；存在']];
root.innerHTML='<div class="slide-label">Word Bank · Questions 21–30</div><div class="slide-title">'+slide.title+'</div><div class="slide-subtitle">選項只在此完整列出一次；作答時先判斷詞性，再看搭配與上下文。</div><div class="summary-table-wrap">'+table(['選項','單字／片語','詞性','中文'],rows)+'</div>';
}else if(slide.type==='question'){
const options=slide.options.map((option,index)=>'<div class="q-opt" id="option-'+index+'"><span class="q-opt-label">'+String.fromCharCode(65+index)+'</span>'+option+'</div>').join('');
root.innerHTML='<div class="q-header"><span class="q-num">第 '+slide.num+' 題</span><span class="q-type-tag">'+slide.qtype+'</span><span class="q-star">★ 單字重點</span></div><div class="q-sentence">'+slide.sentence.replace('_____','<u>_____</u>')+'</div><div class="q-zh zh-target">'+slide.zh+'</div><div class="q-options">'+options+'</div><div class="answer-panel" id="answer-panel"><strong>答案 '+String.fromCharCode(65+slide.answer)+'：'+slide.options[slide.answer]+'</strong><br>'+slide.key+'</div>';
}else if(slide.type==='wordbank-question'){
const wordBankChoices=slide.options.map((option,index)=>'<div class="wordbank-choice" id="wordbank-option-'+index+'"><span class="wordbank-choice-label">'+String.fromCharCode(65+index)+'</span>'+option+'</div>').join('');
root.innerHTML='<div class="q-header"><span class="q-num">第 '+slide.num+' 題</span><span class="q-type-tag">文意選填</span><span class="q-star">★ 詞性＋搭配</span></div><div class="q-sentence">'+slide.sentence.replace('_____','<u>_____</u>')+'</div><div class="q-zh zh-target">'+slide.zh+'</div><div class="wordbank-card"><div class="wordbank-card-title">OPTIONS A–J</div><div class="wordbank-grid">'+wordBankChoices+'</div></div><div class="answer-panel" id="answer-panel"><strong>答案 '+String.fromCharCode(65+slide.answer)+'：'+slide.options[slide.answer]+'</strong><br>'+slide.key+'</div>';
}else if(slide.type==='supplement'){
const answerVocabIndex=slide.answerVocabIndex??slide.answer;
const rows=slide.vocab.map((row,index)=>['<span class="word">'+row[0]+'</span>',row[1],row[2],row[3],index===answerVocabIndex?'<span class="tag">正解</span>':'']);
root.innerHTML='<div class="slide-label">Question '+slide.num+' · Vocabulary Focus</div><div class="supplement-head"><span class="answer-word">'+slide.options[slide.answer]+'</span><span class="answer-meaning">'+slide.vocab[answerVocabIndex][2]+'</span></div>'+noteCard(boardNotes[slide.num])+table(['單字','詞性','中文','常見搭配',''],rows,'mini-table')+'<div class="supplement-grid"><div class="micro-card"><h3>單字家族</h3><p>'+slide.family+'</p></div><div class="micro-card"><h3>同義字與近義字</h3><p>'+slide.syn+'</p></div><div class="micro-card"><h3>本題搭配</h3><ul>'+slide.collocations.map(item=>'<li><span class="word">'+item+'</span><br>'+collocationChinese[item]+'</li>').join('')+'</ul></div></div>';
}else if(slide.type==='vocab-summary'){
const rows=allQuestionData.filter(question=>slide.group.includes(question.num)).flatMap(question=>question.vocab.map((word,index)=>['Q'+question.num+(index===question.answer?' ★':''),'<span class="word">'+word[0]+'</span>',word[1],word[2],word[3]]));
root.innerHTML='<div class="slide-label">Vocabulary Review</div><div class="slide-title">'+slide.title+'</div><div class="summary-table-wrap">'+table(['出處','單字','詞性','中文','搭配'],rows)+'</div>';
}else if(slide.type==='family'){
root.innerHTML='<div class="slide-label">Word Families</div><div class="slide-title">'+slide.title+'</div><div class="summary-table-wrap">'+table(['原形','名詞','動詞','形容詞','副詞','易錯'],familyRows.slice(slide.start,slide.end))+'</div>';
}else if(slide.type==='synonyms'){
root.innerHTML='<div class="slide-label">Synonyms</div><div class="slide-title">同義字與近義字群</div><div class="summary-table-wrap">'+table(['核心概念','同義字群','用法差異','出處'],synonymRows)+'</div>';
}else if(slide.type==='collocations'){
const rows=allQuestionData.flatMap(question=>question.collocations.map(item=>['Q'+question.num,'<span class="word">'+item+'</span>',collocationChinese[item]||'']));
root.innerHTML='<div class="slide-label">Collocations</div><div class="slide-title">本卷必背搭配詞</div><div class="summary-table-wrap">'+table(['出處','搭配','中文'],rows)+'</div>';
}else if(slide.type==='essay-bank'){
root.innerHTML='<div class="slide-label">Writing Bank</div><div class="slide-title">作文可用單字與片語庫</div><div class="slide-subtitle">共 30 組，依主題整理</div><div class="bank-grid">'+Object.entries(essayBank).map(([title,items])=>'<div class="bank-card"><h3>'+title+'</h3><ul>'+items.map(item=>'<li>'+item+'</li>').join('')+'</ul></div>').join('')+'</div>';
}else if(slide.type==='practice'){
root.innerHTML='<div class="slide-label">Interactive Review</div><div class="slide-title">'+slide.title+'</div><div class="practice-list">'+slide.items.map((item,index)=>'<div class="practice-item"><div class="practice-question">'+(index+1)+'. '+item[0]+'</div><div class="practice-answer" id="practice-'+index+'">'+item[1]+'</div></div>').join('')+'</div>';
}else{
root.innerHTML='<div class="hero-card" style="text-align:center;margin-top:8vh"><div class="slide-label">Lesson Complete</div><h1>Lesson 01 完成</h1><p>本次範圍：學測題號 1–30<br>下一階段：篇章結構 31–34</p></div>';
}
setTimeout(applyZh,0);
}
function resetRevealButton(){const button=document.getElementById('reveal-btn');button.textContent='揭曉答案 ▼';button.style.background='';button.style.color=''}
function reveal(){
const slide=slides[current],button=document.getElementById('reveal-btn');
revealed=!revealed;
if(slide.type==='question'){
slide.options.forEach((_,index)=>{const option=document.getElementById('option-'+index);option.classList.toggle('correct',revealed&&index===slide.answer);option.classList.toggle('dimmed',revealed&&index!==slide.answer)});
document.getElementById('answer-panel').classList.toggle('show',revealed);
}else if(slide.type==='wordbank-question'){
slide.options.forEach((_,index)=>{const option=document.getElementById('wordbank-option-'+index);option.classList.toggle('correct',revealed&&index===slide.answer);option.classList.toggle('dimmed',revealed&&index!==slide.answer)});
document.getElementById('answer-panel').classList.toggle('show',revealed);
}else if(slide.type==='practice'){
slide.items.forEach((_,index)=>document.getElementById('practice-'+index).classList.toggle('show',revealed));
}
button.textContent=revealed?'隱藏答案 ▲':'揭曉答案 ▼';
if(revealed){button.style.background='#059669';button.style.color='white'}else{button.style.background='';button.style.color=''}
}
function navigate(direction){const next=current+direction;if(next<0||next>=slides.length)return;current=next;document.getElementById('slide-area').scrollTop=0;render()}
document.addEventListener('keydown',event=>{if(event.key==='ArrowRight')navigate(1);if(event.key==='ArrowLeft')navigate(-1);if((event.key===' '||event.key==='Enter')&&!document.getElementById('reveal-btn').classList.contains('hidden')){event.preventDefault();reveal()}});
render();
</script>
